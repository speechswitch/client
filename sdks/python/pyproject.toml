[project]
name = "speechswitch-types"
version = "0.0.0"
requires-python = ">=3.13"
description = "SpeechSwitch types generated from canonical TypeScript schemas"
dependencies = []

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["speechswitch", "tests/valid.py", "tests/test_http.py", "tests/test_stream.py", "tests/test_smallest.py", "tests/test_typecast.py", "tests/test_vocu.py", "tests/test_sse.py", "tests/test_voice_ai.py", "tests/test_validation.py", "tests/test_mistral.py", "tests/test_websocket.py", "tests/test_async.py", "tests/test_camb.py", "tests/test_cartesia.py"]
reportUnusedImport = false
