[project]
name = "speechswitch-types"
version = "0.0.0"
requires-python = ">=3.13"
description = "SpeechSwitch types generated from canonical TypeScript schemas"
dependencies = []

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["speechswitch", "tests/valid.py", "tests/test_http.py", "tests/test_stream.py", "tests/test_smallest.py", "tests/test_typecast.py", "tests/test_vocu.py", "tests/test_sse.py", "tests/test_voice_ai.py", "tests/test_validation.py", "tests/test_mistral.py", "tests/test_websocket.py", "tests/test_async.py", "tests/test_camb.py", "tests/test_cartesia.py", "tests/test_deepdub.py", "tests/test_deepgram.py", "tests/test_elevenlabs.py", "tests/test_fish.py", "tests/test_msgpack.py", "tests/test_google_protobuf.py", "tests/test_google_rest.py", "tests/test_hpack.py", "tests/test_grpc.py", "tests/test_google.py", "tests/test_gradium.py", "tests/test_hume.py", "tests/test_inworld.py", "tests/test_kugelaudio.py", "tests/test_lovo.py", "tests/test_microsoft.py"]
reportUnusedImport = false
